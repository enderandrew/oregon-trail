<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="./style-crt.min.css" media="screen" title="Default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#1f1e1e">
    <title>Oregon Trail</title>
    <meta name="description" content="The Oregon Trail is a text-based strategy video game developed by Don Rawitsch, Bill Heinemann, and Paul Dillenberger in 1971.">
    <meta property="og:title" content="Oregon Trail">
    <meta property="og:description" content="The Oregon Trail is a text-based strategy video game developed by Don Rawitsch, Bill Heinemann, and Paul Dillenberger in 1971.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oregontrail.run">
    <meta property="og:image" content="https://oregontrail.run/img/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="730">
    <meta property="og:image:height" content="450">
    <meta property="og:image:alt" content="Oregon Trail - Sample run">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#000000">
    <meta name="apple-mobile-web-app-title" content="Oregon Trail">
    <meta name="application-name" content="Oregon Trail">
    <meta name="msapplication-TileColor" content="#000000">

    <script src="./js/lib/EncoderDecoderTogether.min.js" nomodule="" type="text/javascript"></script>
    <link href="./css/app.css" rel="stylesheet" />
    <base href="./">

    <style>
        /* 1. Screen Positioning & Centering */
        #screen {
            z-index: 1 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 30px 40px !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
        }

        /* 2. Terminal Visibility & Canvas Transparency */
        #terminal {
            opacity: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        #terminal canvas {
            background-color: transparent !important;
        }

        /* 3. Green Phosphor CRT Bloom & Glow Effects */
        .crt, #terminal .xterm {
            color: #33ff33 !important;
            filter: drop-shadow(0px 0px 3px rgba(51, 255, 51, 0.75));
        }

        .glow {
            opacity: 0.35 !important; /* Enhanced CRT green ambient glow */
            z-index: 100 !important;
            pointer-events: none !important;
        }

        .scanlines {
            z-index: 101 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="disable-select crt">
    <noscript>
        <strong>
            We're sorry but Oregon Trail doesn't work properly without JavaScript enabled.
            Please enable it to continue.
        </strong>
    </noscript>
    
    <div class="frame" id="container">
        <div class="piece output crt crt-boot-sequence" id="screen">
            <div id="display" class="scanlines"></div> 
            
            <div id="terminal"></div>
            <div class="simple-keyboard"></div>
            <noscript>
                <div class="js-disabled">Please enable JavaScript in your browser.</div>
            </noscript>
            
            <script src="js/app.js"></script>

            <!-- Override Terminal layout and theme settings -->
            <script>
                if (typeof Options !== "undefined") {
                    // Set Green Phosphor color scheme & enable transparency
                    Options.terminal.xterm.theme = {
                        foreground: "#33FF33",
                        background: "rgba(0,0,0,0)",
                        cursor: "#33FF33",
                        cursorAccent: "#003300"
                    };
                    Options.terminal.xterm.allowTransparency = true;
                }

                if (typeof Term !== "undefined") {
                    const screenEl = document.getElementById("screen");
                    
                    Term.options.theme = Options.terminal.xterm.theme;

                    Term.windowResize = (e) => {
                        if (Term.resizeInProgress = true, e && void 0 !== e || !Term.isWriting) {
                            const padX = 40;
                            const padY = 30;
                            const availWidth = screenEl.clientWidth - (padX * 2);
                            const availHeight = screenEl.clientHeight - (padY * 2);

                            if (availWidth > 0 && availHeight > 0) {
                                // Scale font size to fit 24 rows vertically
                                let fontSizeW = Math.floor(availWidth / (80 * 0.6));
                                let fontSizeH = Math.floor(availHeight / (24 * 1.25));
                                let newFontSize = Math.max(12, Math.min(fontSizeW, fontSizeH));

                                Term.options.fontSize = newFontSize;

                                // Stretch letter-spacing across 16:9 widescreen
                                let currentCellWidth = newFontSize * 0.6;
                                let targetCellWidth = availWidth / 80;
                                let extraSpacing = Math.max(0, Math.floor(targetCellWidth - currentCellWidth));
                                Term.options.letterSpacing = Math.min(extraSpacing, 6);

                                let termHeight = availHeight;
                                if (Utils.isMobile()) {
                                    const kb = document.querySelector(Options.keyboard.selector);
                                    if (kb) termHeight -= kb.offsetHeight;
                                }

                                Term.scrollHeight = Math.floor(termHeight / Term.rows);
                                App.termEl.style.margin = "0";
                                App.termEl.style.width = availWidth + "px";
                                App.termEl.style.height = termHeight + "px";

                                Term.fit();
                            }
                            Term.resizeInProgress = false;
                        }
                    };

                    Term.windowResize();
                }
            </script>
        </div>
        
        <div class="piece scanlines noclick"></div>
        <div class="piece glow noclick"></div>
        
        <div id="monitor-controls">
            <div class="led"></div>
            <div class="switch" title="Power"></div>
            <div class="knob" title="Brightness">
                <span class="knob-label">BRT</span>
            </div>
            <div class="knob" style="transform: rotate(45deg);" title="Contrast">
                <span class="knob-label">CON</span>
            </div>
        </div>
    </div>

    <!-- Monitor Knobs & Power Switch Controls -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const e = document.getElementById("screen"),
                  t = document.querySelector(".led"),
                  o = document.querySelector(".switch"),
                  n = document.querySelector('.knob[title="Brightness"]'),
                  s = document.querySelector('.knob[title="Contrast"]'),
                  c = new Audio("./sounds/crt.ogg"),
                  r = new Audio("./sounds/knob.ogg");
            
            let d = !0;
            o.addEventListener("click", () => {
                c.currentTime = 0;
                c.play().catch(e => console.warn("Audio play prevented:", e));
                d ? (
                    t.classList.add("off"),
                    e.classList.remove("crt-turn-on"),
                    e.classList.add("turn-off"),
                    d = !1
                ) : (
                    t.classList.remove("off"),
                    e.classList.remove("turn-off"),
                    e.offsetWidth,
                    e.classList.add("crt-turn-on"),
                    d = !0
                );
            });

            let l = 0;
            const a = ["", "brt-high", "brt-low"],
                  i = [0, 45, -45];
            n.addEventListener("click", () => {
                r.currentTime = 0;
                r.play().catch(e => console.warn("Audio play prevented:", e));
                l = (l + 1) % a.length;
                n.style.transform = `rotate(${i[l]}deg)`;
                e.classList.remove("brt-high", "brt-low");
                a[l] && e.classList.add(a[l]);
            });

            let u = 1;
            const m = ["", "con-high", "con-low"],
                  h = [0, 45, -45];
            s.addEventListener("click", () => {
                r.currentTime = 0;
                r.play().catch(e => console.warn("Audio play prevented:", e));
                u = (u + 1) % m.length;
                s.style.transform = `rotate(${h[u]}deg)`;
                e.classList.remove("con-high", "con-low");
                m[u] && e.classList.add(m[u]);
            });
        });
    </script>
</body>
</html>
